<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreatorVerwaltung</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0a10;--panel:#15131d;--panel2:#1b1825;--text:#f7f3ff;--muted:#aaa3ba;--accent:#c6a6ff;--accent2:#f0b6e8;--line:#2a2637;--good:#92e6b1;--bad:#ff9cab}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 85% 0,#21172d 0,transparent 30%),var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(470px,100%);padding:38px;border:1px solid var(--line);border-radius:28px;background:rgba(21,19,29,.94);box-shadow:0 30px 80px #0008}.mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#15101b;font-weight:900;font-size:24px}.login h1{font-size:34px;margin:22px 0 8px}.muted{color:var(--muted)}.btn{border:0;border-radius:13px;padding:12px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#17111d;font-weight:800;cursor:pointer}.btn.secondary{background:#24202f;color:var(--text);border:1px solid var(--line)}.btn.danger{background:#3a2028;color:#ffdce2}.login .btn{width:100%;margin-top:24px;padding:15px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px;background:#0e0d13;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:20px;padding:8px 10px 24px}.nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--muted);padding:11px 12px;border-radius:11px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#1d1928;color:#fff}.side-bottom{position:absolute;bottom:20px;left:16px;right:16px}.main{padding:32px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:28px}.top h1{margin:0;font-size:29px}.pill{border:1px solid var(--line);background:#181520;padding:8px 11px;border-radius:999px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(180deg,#17141f,#121019);border:1px solid var(--line);border-radius:19px;padding:20px}.metric b{font-size:29px;display:block;margin-top:8px}.section{margin-top:20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:12px}.section h2{font-size:18px;margin:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:17px}table{width:100%;border-collapse:collapse;background:#121019}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}tr:last-child td{border-bottom:0}.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff536d;margin-right:7px}.empty{text-align:center;padding:42px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,select,textarea{background:#0f0d14;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px}textarea{min-height:95px;resize:vertical}
.modal-bg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#17141f;border:1px solid var(--line);border-radius:22px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px}.notice{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#15121d;color:var(--muted);margin:10px 0}
@media(max-width:950px){.section[style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important}.shell{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.side-bottom{position:static;margin-top:15px}.grid{grid-template-columns:1fr 1fr}.main{padding:22px}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}}@media(max-width:560px){.grid,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}

/* Login-Willkommensbildschirm */
.cv-welcome{
  position:fixed; inset:0; z-index:99999;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 18%, rgba(167,116,255,.20), transparent 35%),
    rgba(7,6,12,.96);
  backdrop-filter:blur(14px);
}
.cv-welcome-card{
  width:min(620px,100%);
  padding:42px 36px;
  border:1px solid rgba(198,169,255,.22);
  border-radius:26px;
  background:linear-gradient(145deg,rgba(29,23,45,.98),rgba(15,13,24,.98));
  box-shadow:0 28px 90px rgba(0,0,0,.5),0 0 50px rgba(150,92,255,.10);
  text-align:center;
}
.cv-welcome-logo{
  width:76px;height:76px;margin:0 auto 22px;
  display:grid;place-items:center;
  border-radius:22px;
  font-size:26px;font-weight:900;letter-spacing:-1px;
  color:#fff;
  background:linear-gradient(145deg,#9d72ff,#6e45c8);
  box-shadow:0 12px 34px rgba(126,77,224,.32);
}
.cv-welcome-card h1{margin:0 0 10px;font-size:30px}
.cv-welcome-card .hello{font-size:18px;font-weight:700;margin-bottom:18px}
.cv-welcome-card p{max-width:510px;margin:0 auto 13px;line-height:1.65;color:var(--muted)}
.cv-welcome-card strong{color:var(--text)}
.cv-welcome-btn{margin-top:18px;min-width:220px}

</style>
</head>
<body>
<div id="login" class="login">
 <div class="login-card"><div class="mark">CV</div><h1>CreatorVerwaltung</h1>
 <p class="muted">Interner Bereich für Creator, Streams, Warns, Termine und Organisation. Zugriff nur für von der Inhaberin freigegebene Discord-Accounts.</p>
 <div id="loginMsg" class="notice hidden"></div><button id="discordLogin" class="btn">Mit Discord anmelden</button></div>
</div>

<div id="app" class="shell hidden">
 <aside class="side"><div class="brand">CreatorVerwaltung</div><div class="nav" id="nav">
  <button data-page="dashboard" class="active">Dashboard</button><button data-page="creators">Creator</button><button data-page="live">Live jetzt</button>
  <button data-page="streamchecks">Stream-Prüfungen</button><button data-page="warns">Creator Warns</button><button data-page="calendar">Termine</button><button data-page="tasks">Meine Aufgaben</button>
  <button data-page="settings">Baukasten</button><button data-page="archive" class="owner-only">Archiv</button><button data-page="access" class="owner-only">Zugriffsverwaltung</button>
 </div><div class="side-bottom"><div id="who" class="pill"></div><button id="logout" class="btn secondary" style="width:100%;margin-top:10px">Abmelden</button></div></aside>
 <main class="main"><div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="muted" id="subtitle">Deine Creator-Verwaltung auf einen Blick.</div></div><div class="pill" id="rolePill"></div></div><div id="content"></div></main>
</div>
<div id="modalRoot"></div>

<script>
const SUPABASE_URL="https://sivdyarxpeuvvpdmzycw.supabase.co";
const SUPABASE_KEY="sb_publishable_dS1-tlpJEbpX8jW0vFHGkQ_Dfu_plgQ";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null, profile=null, access=null, creators=[], warns=[], events=[], tasks=[], categories=[], accesses=[], permissions=[], creatorHistory=[], streamReviews=[], liveStreams=[], liveLoading=false, liveError="", twitchStats30d=[], taskFilter="open", streamReviewFilter="open";

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function discordIdFromUser(u){const md=u?.user_metadata||{};return String(md.provider_id||md.sub||u?.identities?.find(x=>x.provider==="discord")?.identity_data?.sub||u?.identities?.find(x=>x.provider==="discord")?.id||"")}
async function login(){await sb.auth.signInWithOAuth({provider:"discord",options:{redirectTo:location.origin+location.pathname}})}
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return;

  me = session.user;

  const {data, error} = await sb.rpc("cv_finish_discord_login");

  if(error){
    console.error("cv_finish_discord_login:", error);
    return deny("Discord-Anmeldung konnte nicht geprüft werden.");
  }

  const a = Array.isArray(data) ? data[0] : data;

  if(!a || !a.enabled){
    await sb.auth.signOut();
    return deny("Dieser Discord-Account wurde nicht für die CreatorVerwaltung freigegeben.");
  }

  access = a;

  const {data:p} = await sb
    .from("cv_profiles")
    .select("*")
    .eq("id", me.id)
    .maybeSingle();

  profile = p;

  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");

  $("#who").textContent =
    profile?.display_name ||
    access.display_name ||
    access.discord_username ||
    "Discord";

  $("#rolePill").textContent =
    access.role === "owner" ? "Inhaberin" : access.role;

  document.querySelectorAll(".owner-only").forEach(x =>
    x.classList.toggle("hidden", access.role !== "owner")
  );

  await reload();
  render("dashboard");
  showWelcome();
}
function deny(msg){$("#loginMsg").textContent=msg;$("#loginMsg").classList.remove("hidden")}

function showWelcome(){
  if(document.getElementById("cvWelcome")) return;

  const name =
    profile?.display_name ||
    access?.display_name ||
    access?.discord_username ||
    "";

  const wrap=document.createElement("div");
  wrap.className="cv-welcome";
  wrap.id="cvWelcome";
  wrap.innerHTML=`
    <div class="cv-welcome-card">
      <div class="cv-welcome-logo">CV</div>
      <h1>Willkommen in der CreatorVerwaltung 💜</h1>
      <div class="hello">${name ? `Hallo ${esc(name)}!` : "Schön, dass du da bist!"}</div>
      <p>Vielen Dank, dass du die <strong>CreatorVerwaltung</strong> tagtäglich unterstützt und dazu beiträgst, dass alles organisiert und reibungslos läuft.</p>
      <p>Sollten Fragen entstehen, Fehler auftreten oder du Unterstützung benötigen, wende dich bitte jederzeit an die <strong>Inhaberin Brownie</strong>.</p>
      <p><strong>Danke für deine Unterstützung und viel Spaß bei der Arbeit! 💜</strong></p>
      <button class="btn cv-welcome-btn" onclick="document.getElementById('cvWelcome')?.remove()">Zur CreatorVerwaltung</button>
    </div>`;
  document.body.appendChild(wrap);
}

async function reload(){
  const [c,w,e,t,cat,a,p,h,sr,ts] = await Promise.all([
    sb.from("cv_creators").select("*").order("name"),
    sb.from("cv_warns").select("*").order("created_at",{ascending:false}),
    sb.from("cv_events").select("*").order("event_date"),
    sb.from("cv_tasks").select("*").order("done").order("due_date"),
    sb.from("cv_categories").select("*").order("position"),
    sb.from("cv_access").select("*").order("created_at"),
    sb.from("cv_permissions").select("*"),
    sb.from("cv_creator_history").select("*").order("created_at",{ascending:false}),
    sb.from("cv_stream_reviews").select("*").order("detected_at",{ascending:false}),
    sb.rpc("cv_get_twitch_stats_30d")
  ]);

  creators = c.data || [];
  warns = w.data || [];
  events = e.data || [];
  tasks = t.data || [];
  categories = cat.data || [];
  accesses = a.data || [];
  permissions = p.data || [];
  creatorHistory = h.data || [];
  streamReviews = sr.data || [];
  if(sr.error) console.error("cv_stream_reviews:",sr.error);
  twitchStats30d = ts.data || [];
  applyPermissionUI();
}
function myPermissions(){
  if(access?.role === "owner") return {};
  return permissions.find(p => String(p.discord_id) === String(access?.discord_id)) || {};
}

function hasPerm(name){
  if(access?.role === "owner") return true;
  return myPermissions()?.[name] === true;
}

function applyPermissionUI(){
  const rules = {
    creators:"creator_view",
    live:"live_view",
    streamchecks:"stream_checks_view",
    warns:"warns_view",
    calendar:"events_view",
    tasks:"tasks_view",
    settings:"builder_view"
  };

  document.querySelectorAll("#nav button[data-page]").forEach(btn=>{
    const page=btn.dataset.page;
    if(page==="dashboard"){
      btn.classList.remove("hidden");
    }else if(page==="access"){
      btn.classList.toggle("hidden",access?.role!=="owner");
    }else{
      const perm=rules[page];
      btn.classList.toggle("hidden",perm ? !hasPerm(perm) : false);
    }
  });
}

function permissionDenied(){
  return `<div class="card empty">Für diesen Bereich hast du keine Berechtigung.</div>`;
}


function twitchStatsForCreator(id){
  const row=twitchStats30d.find(s=>String(s.creator_id)===String(id));
  return {
    days:Number(row?.stream_days||0),
    avg:Number(row?.average_viewers||0),
    peak:Number(row?.peak_viewers||0)
  };
}

async function syncDiscordCreatorRole(discordId, rank, options={}){
  const id=String(discordId||"").trim();
  if(!id) return {success:true, skipped:true};

  const body={discord_id:id,rank:rank===undefined ? null : rank};

  if(options?.announce) body.announce=options.announce;
  if(options?.oldRank) body.old_rank=options.oldRank;

  const {data,error}=await sb.functions.invoke("cv-discord-roles",{body});

  if(error){
    console.error("cv-discord-roles:",error);
    return {success:false,error:error.message||"Discord-Rollensync fehlgeschlagen."};
  }
  if(!data?.success){
    console.error("cv-discord-roles:",data);
    return {success:false,error:data?.error||"Discord-Rollensync fehlgeschlagen."};
  }
  return {success:true,data};
}

function showDiscordSyncWarning(result){
  if(result?.success) return;
  alert(
    "Der Eintrag wurde gespeichert, aber die Discord-Rolle konnte nicht synchronisiert werden.\n\n" +
    (result?.error||"Unbekannter Fehler")
  );
}

function twitchNameFromUrl(url){
  if(!url) return "";
  try{
    const u=new URL(url.startsWith("http")?url:`https://${url}`);
    if(!/^(www\.)?twitch\.tv$/i.test(u.hostname)) return "";
    return (u.pathname.split("/").filter(Boolean)[0]||"").toLowerCase();
  }catch{
    return String(url).replace(/^https?:\/\/(www\.)?twitch\.tv\//i,"").split(/[/?#]/)[0].trim().toLowerCase();
  }
}

async function refreshLiveStreams(showLoading=true){
  const activeCreators=creators.filter(c=>!c.archived && c.twitch_url);
  const usernames=[...new Set(activeCreators.map(c=>twitchNameFromUrl(c.twitch_url)).filter(Boolean))];

  if(!usernames.length){
    liveStreams=[];
    liveError="";
    liveLoading=false;
    if(document.querySelector("#liveStatusArea")) renderLiveStatusArea();
    return;
  }

  if(showLoading){
    liveLoading=true;
    liveError="";
    if(document.querySelector("#liveStatusArea")) renderLiveStatusArea();
  }

  const {data,error}=await sb.functions.invoke("cv-twitch",{
    body:{usernames}
  });

  liveLoading=false;

  if(error){
    console.error("cv-twitch:",error);
    liveError=error.message||"Twitch-Abfrage fehlgeschlagen.";
    liveStreams=[];
  }else if(!data?.success){
    liveError=data?.error||"Twitch-Abfrage fehlgeschlagen.";
    liveStreams=[];
  }else{
    liveError="";
    liveStreams=Array.isArray(data.streams)?data.streams:[];
  }

  if(document.querySelector("#liveStatusArea")) renderLiveStatusArea();
}

function renderLiveStatusArea(){
  const box=document.querySelector("#liveStatusArea");
  if(!box) return;

  const activeCreators=creators.filter(c=>!c.archived);
  const creatorByTwitch=new Map(
    activeCreators
      .map(c=>[twitchNameFromUrl(c.twitch_url),c])
      .filter(([name])=>name)
  );

  if(liveLoading){
    box.innerHTML=`<div class="card empty">Twitch wird gerade abgefragt …</div>`;
    return;
  }

  if(liveError){
    box.innerHTML=`<div class="notice">Twitch-Abfrage fehlgeschlagen: ${esc(liveError)}</div>`;
    return;
  }

  if(!liveStreams.length){
    box.innerHTML=`<div class="card empty">Aktuell ist keiner der eingetragenen Creator live.</div>`;
    return;
  }

  box.innerHTML=`<div class="table-wrap"><table>
    <thead><tr><th>Creator</th><th>Titel</th><th>Kategorie</th><th>Zuschauer</th><th>Seit</th><th>Twitch</th></tr></thead>
    <tbody>${liveStreams.map(s=>{
      const creator=creatorByTwitch.get(String(s.user_login||"").toLowerCase());
      const started=s.started_at?new Date(s.started_at).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"}):"–";
      const url=creator?.twitch_url||`https://www.twitch.tv/${encodeURIComponent(s.user_login||"")}`;
      return `<tr>
        <td><span class="live-dot"></span><b>${esc(creator?.name||s.user_name||s.user_login||"Twitch")}</b></td>
        <td>${esc(s.title||"–")}</td>
        <td>${esc(s.game_name||"–")}</td>
        <td>${Number(s.viewer_count||0).toLocaleString("de-DE")}</td>
        <td>${esc(started)}</td>
        <td><a href="${esc(url)}" target="_blank">Stream öffnen</a></td>
      </tr>`;
    }).join("")}</tbody>
  </table></div>`;
}

function setPageTitle(p){const m={dashboard:["Dashboard","Deine Creator-Verwaltung auf einen Blick."],creators:["Creator","Profile, Links, Statistiken und interne Informationen."],live:["Live jetzt","Aktuelle Streams und gespeicherte Peak-Zuschauer."],streamchecks:["Stream-Prüfungen","Automatisch erkannte Auffälligkeiten aus Creator-Streams prüfen."],warns:["Creator Warns","Warnungen und Laufzeiten übersichtlich verwalten."],calendar:["Termine","Persönliche und gemeinsame Termine."],tasks:["Meine Aufgaben","Deine privaten To-dos."],settings:["Baukasten","Kategorien der Verwaltung selbst organisieren."],archive:["Archiv","Gelöschte Einträge 30 Tage lang nachvollziehen und wiederherstellen."],access:["Zugriffsverwaltung","Du entscheidest, welche Discord-Accounts Zugriff haben."]};$("#pageTitle").textContent=m[p][0];$("#subtitle").textContent=m[p][1]}
function render(p){
  const perms={creators:"creator_view",live:"live_view",streamchecks:"stream_checks_view",warns:"warns_view",calendar:"events_view",tasks:"tasks_view",settings:"builder_view"};
  if((p==="access" || p==="archive") && access.role!=="owner") p="dashboard";
  if(perms[p] && !hasPerm(perms[p])) p="dashboard";
  setPageTitle(p);
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
  const fn={dashboard:dash,creators:creatorPage,live:livePage,streamchecks:streamChecksPage,warns:warnPage,calendar:eventPage,tasks:taskPage,settings:settingsPage,archive:archivePage,access:accessPage}[p];
  $("#content").innerHTML=fn();
}
function dash(){
  const activeCreators=creators.filter(c=>!c.archived);
  const activeWarns=warns.filter(w=>!w.archived && new Date(w.expires_at)>new Date());

  const today=new Date();
  today.setHours(0,0,0,0);

  const myOpenTasks=tasks.filter(t=>!t.done);
  const overdueTasks=myOpenTasks.filter(t=>{
    if(!t.due_date) return false;
    const d=new Date(t.due_date+"T00:00:00");
    return d<today;
  });

  const upcomingEvents=events
    .filter(e=>!e.archived && e.event_date && new Date(e.event_date+"T00:00:00")>=today)
    .sort((a,b)=>{
      const ad=new Date(`${a.event_date}T${a.event_time||"23:59"}`).getTime();
      const bd=new Date(`${b.event_date}T${b.event_time||"23:59"}`).getTime();
      return ad-bd;
    })
    .slice(0,5);

  const liveCreatorRows=liveStreams.slice(0,5).map(s=>{
    const creator=activeCreators.find(c=>twitchNameFromUrl(c.twitch_url)===String(s.user_login||"").toLowerCase());
    const url=creator?.twitch_url||`https://www.twitch.tv/${encodeURIComponent(s.user_login||"")}`;
    return `<tr>
      <td><span class="live-dot"></span><b>${esc(creator?.name||s.user_name||s.user_login||"Twitch")}</b></td>
      <td>${Number(s.viewer_count||0).toLocaleString("de-DE")}</td>
      <td><a href="${esc(url)}" target="_blank">Öffnen</a></td>
    </tr>`;
  }).join("");

  const taskPreview=myOpenTasks
    .sort((a,b)=>{
      const ad=a.due_date?new Date(a.due_date+"T00:00:00").getTime():Infinity;
      const bd=b.due_date?new Date(b.due_date+"T00:00:00").getTime():Infinity;
      return ad-bd;
    })
    .slice(0,5);

  const notifications=[];

  overdueTasks.forEach(t=>{
    notifications.push({
      type:"Aufgabe",
      text:`„${t.title}“ ist überfällig.`,
      page:"tasks"
    });
  });

  myOpenTasks.filter(t=>{
    if(!t.due_date) return false;
    const d=new Date(t.due_date+"T00:00:00");
    return d.getTime()===today.getTime();
  }).forEach(t=>{
    notifications.push({
      type:"Aufgabe",
      text:`„${t.title}“ ist heute fällig.`,
      page:"tasks"
    });
  });

  activeWarns.forEach(w=>{
    const end=new Date(w.expires_at);
    const diff=Math.ceil((end-new Date())/(1000*60*60*24));
    if(diff>=0 && diff<=3){
      const creator=creators.find(c=>c.id===w.creator_id)?.name||"Creator";
      notifications.push({
        type:"Warn",
        text:`Warn von ${creator} läuft ${diff===0?"heute":`in ${diff} Tag${diff===1?"":"en"}`} ab.`,
        page:"warns"
      });
    }
  });

  streamReviews.filter(r=>r.status==="open").slice(0,5).forEach(r=>{
    const creator=creators.find(c=>String(c.id)===String(r.creator_id))?.name||"Creator";
    notifications.push({
      type:"Stream-Prüfung",

function creatorRankHistory(creatorId){
  const rows=creatorHistory
    .filter(h=>String(h.creator_id)===String(creatorId))
    .filter(h=>h.changes && h.changes.Rang)
    .sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0));

  return rows.map(h=>({
    from:h.changes?.Rang?.alt ?? "–",
    to:h.changes?.Rang?.neu ?? "–",
    by:h.changed_by_name||"Unbekannt",
    at:h.created_at
  }));
}

function currentRankSince(c){
  const history=creatorRankHistory(c.id);
  const last=[...history].reverse().find(x=>String(x.to)===String(c.rank));
  const start=last?.at || c.created_at || c.joined_at;
  if(!start) return {date:"–",days:"–"};

  const d=new Date(start);
  const now=new Date();
  const days=Math.max(0,Math.floor((now-d)/(1000*60*60*24)));
  return {
    date:d.toLocaleDateString("de-DE"),
    days
  };
}

function uprankHistoryHtml(c){
  const rows=creatorRankHistory(c.id);

  return `<div style="display:grid;gap:10px">
    ${[...rows].reverse().map(r=>`

  </div>`;
}

function streamReviewStatusLabel(status){
  return ({open:"Offen",no_violation:"Kein Verstoß",observe:"Beobachten",conversation:"Gespräch nötig",reviewed:"Geprüft"})[status]||status||"Offen";
}
function streamReviewResultLabel(result){
  return ({no_violation:"Kein Verstoß",observe:"Beobachten",conversation:"Gespräch nötig",other:"Sonstiges"})[result]||"Geprüft";
}
function streamOffsetLabel(seconds){
  if(seconds===null||seconds===undefined||seconds==="") return "–";
  const total=Math.max(0,Number(seconds)||0);
  const h=Math.floor(total/3600),m=Math.floor((total%3600)/60),s=Math.floor(total%60);
  return [h,m,s].map(v=>String(v).padStart(2,"0")).join(":");
}
function streamOccurrenceLabel(review){
  if(!review?.stream_started_at || review?.stream_offset_seconds===null || review?.stream_offset_seconds===undefined || review?.stream_offset_seconds==="") return "–";
  const started=new Date(review.stream_started_at);
  if(Number.isNaN(started.getTime())) return "–";
  const occurrence=new Date(started.getTime()+(Math.max(0,Number(review.stream_offset_seconds)||0)*1000));
  return occurrence.toLocaleString("de-DE",{dateStyle:"short",timeStyle:"medium"});
}

async function completeStreamReview(id){
  if(!hasPerm("stream_checks_edit")) return alert("Keine Berechtigung.");
  const result=$("#streamReviewResult")?.value;
  const review=streamReviews.find(r=>String(r.id)===String(id));
  const creator=creators.find(c=>String(c.id)===String(review?.creator_id));
  const {error}=await sb.rpc("cv_complete_stream_review",{p_id:id,p_result:result});
  if(error){console.error(error);alert("Prüfung konnte nicht abgeschlossen werden: "+error.message);return;}
  closeModal();
  const discordResult=await sb.functions.invoke("cv-discord-stream-checks",{body:{
    action:"completed",
    discord_id:creator?.discord_id||"",
    creator_name:creator?.name||"Unbekannt",
    category:review?.category||"Auffälligkeit",
    stream_offset_seconds:review?.stream_offset_seconds,
    result:streamReviewResultLabel(result),
    reviewed_at:new Date().toISOString()
  }});
  if(discordResult.error || !discordResult.data?.success){
    console.error("cv-discord-stream-checks:",discordResult.error||discordResult.data);
    alert("Die Prüfung wurde abgehakt, aber die Discord-Meldung konnte nicht gesendet werden.");
  }
  await reload();render("streamchecks");
}
async function reopenStreamReview(id){

  await reload();render("streamchecks");
}

function taskPage(){
  if(!hasPerm("tasks_view")) return permissionDenied();

  const today=new Date();
  today.setHours(0,0,0,0);

  let rows=[...tasks];
  if(taskFilter==="open") rows=rows.filter(t=>!t.done);
  if(taskFilter==="done") rows=rows.filter(t=>!!t.done);

  rows.sort((a,b)=>{
    if(!!a.done!==!!b.done) return a.done?1:-1;
    const ad=a.due_date?new Date(a.due_date+"T00:00:00").getTime():Infinity;
    const bd=b.due_date?new Date(b.due_date+"T00:00:00").getTime():Infinity;
    return ad-bd;
  });

  const cards=rows.length ? rows.map(t=>{
    const due=t.due_date?new Date(t.due_date+"T00:00:00"):null;
    const overdue=due && !t.done && due<today;
    const dueText=t.due_date ? new Date(t.due_date+"T00:00:00").toLocaleDateString("de-DE") : "ohne Termin";
    const canEdit=hasPerm("tasks_edit");
    const canDelete=hasPerm("tasks_delete");

    return `<div class="card" style="margin-bottom:10px;${overdue?"border-color:#ff9cab;":""}">
      <div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start">
        <div style="min-width:0">
          <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
            <b style="${t.done?"text-decoration:line-through;opacity:.65;":""}">${esc(t.title)}</b>
            ${t.done?`<span class="pill">Erledigt</span>`:""}
            ${overdue?`<span class="pill" style="color:#ffdce2;border-color:#6c3540">Überfällig</span>`:""}
          </div>
          <div class="muted small" style="margin-top:6px">${esc(t.priority||"Normal")} · ${esc(dueText)}</div>
          ${t.note?`<div class="small" style="margin-top:8px;white-space:pre-wrap">${esc(t.note)}</div>`:""}
        </div>
        ${(canEdit||canDelete)?`<div class="actions" style="justify-content:flex-end">
          ${canEdit?`<button class="btn secondary" onclick="toggleTask('${t.id}',${t.done?"false":"true"})">${t.done?"↩ Wieder öffnen":"✓ Erledigt"}</button>`:""}
          ${canEdit?`<button class="btn secondary" onclick="editTask('${t.id}')">✎ Bearbeiten</button>`:""}
          ${canDelete?`<button class="btn danger" onclick="deleteTask('${t.id}')">✕ Löschen</button>`:""}
        </div>`:""}
      </div>
    </div>`;
  }).join("") : `<div class="card empty">${taskFilter==="open"?"Keine offenen Aufgaben.":taskFilter==="done"?"Keine erledigten Aufgaben.":"Du hast noch keine Aufgaben."}</div>`;

  return `<div class="section-head">
    <h2>Meine Aufgaben</h2>
    ${hasPerm("tasks_create")?`<button class="btn" onclick="taskModal()">+ Aufgabe</button>`:""}
  </div>
  <div class="actions" style="margin-bottom:14px">
    <button class="btn ${taskFilter==="all"?"":"secondary"}" onclick="setTaskFilter('all')">Alle</button>
    <button class="btn ${taskFilter==="open"?"":"secondary"}" onclick="setTaskFilter('open')">Offen</button>
    <button class="btn ${taskFilter==="done"?"":"secondary"}" onclick="setTaskFilter('done')">Erledigt</button>
  </div>
  ${cards}`;
}

async function updateCreator(id){
  const existingCreator=creators.find(x=>x.id===id);
  const oldDiscordId=String(existingCreator?.discord_id||"").trim();

  const name = $("#ename").value.trim();
  const rank = $("#erank").value;
  const discordId = $("#ediscord").value.trim();
  const twitchUrl = $("#etwitch").value.trim();
  const tiktokUrl = $("#etiktok").value.trim();
  const joinedAt = $("#ejoined").value || null;
  const summary = $("#esummary").value.trim();

  if(!name){
    alert("Bitte einen Namen eintragen.");
    return;
  }

  const {error} = await sb.rpc("cv_update_creator", {
    p_id: id,
    p_name: name,
    p_rank: rank,
    p_discord_id: discordId,
    p_twitch_url: twitchUrl,
    p_tiktok_url: tiktokUrl,
    p_joined_at: joinedAt,
    p_summary: summary
  });

  if(error){
    console.error(error);
    alert("Änderungen konnten nicht gespeichert werden: " + error.message);
    return;
  }

  // Speichern ist in der Datenbank abgeschlossen.
  // Modal sofort sichtbar schließen – unabhängig von reload/Discord.
  const modalRoot=document.getElementById("modalRoot");
  if(modalRoot) modalRoot.innerHTML="";

  const oldRank=existingCreator?.rank||null;

  // Nur echte Upranks verkünden; Downranks bleiben still.
  const normalizeRank=value=>{
    const v=String(value||"").trim();
    return v==="Content Creator" ? "Creator" : v;
  };
  const rankOrder=["Probe Streamer","Streamer","Creator","Creator+"];
  const oldRankIndex=rankOrder.indexOf(normalizeRank(oldRank));
  const newRankIndex=rankOrder.indexOf(normalizeRank(rank));
  const isUprank=
    oldRankIndex >= 0 &&
    newRankIndex >= 0 &&
    newRankIndex > oldRankIndex;

  // Oberfläche neu laden, aber Discord darf die UI nicht blockieren.
  reload()
    .then(()=>render("creators"))
    .catch(err=>console.error("Creator-Ansicht neu laden:",err));

  // Discord-Sync vollständig separat.
  (async()=>{
    try{
      if(oldDiscordId && oldDiscordId!==discordId){
        const oldSync=await Promise.race([
          syncDiscordCreatorRole(oldDiscordId,null),
          new Promise(resolve=>setTimeout(
            ()=>resolve({success:false,error:"Discord-Rollensync Zeitüberschreitung."}),
            10000
          ))
        ]);
        showDiscordSyncWarning(oldSync);
      }

      const syncResult=await Promise.race([
        syncDiscordCreatorRole(
          discordId,
          rank,
          {announce:(isUprank ? "uprank" : null),oldRank:oldRank}
        ),
        new Promise(resolve=>setTimeout(
          ()=>resolve({success:false,error:"Discord-Rollensync Zeitüberschreitung."}),
          10000
        ))
      ]);
      showDiscordSyncWarning(syncResult);
    }catch(err){

async function saveWarn(){
  const creatorId = $("#wcreator").value;
  const reason = $("#wreason").value.trim();
  const durationDays = Math.max(1, Number($("#wdays").value || 1));

  if(!creatorId){
    alert("Bitte einen Creator auswählen.");
    return;
  }

  if(!reason){
    alert("Bitte einen Grund eintragen.");
    return;
  }

  const creator = creators.find(c=>c.id===creatorId);

  const {error} = await sb.rpc("cv_add_warn", {
    p_creator_id: creatorId,
    p_reason: reason,
    p_duration_days: durationDays
  });

  if(error){
    console.error(error);
    alert("Warn konnte nicht gespeichert werden: " + error.message);
    return;
  }

  // Creator Warn zusätzlich automatisch im Discord posten.
  // Der Warn bleibt gespeichert, auch wenn Discord einmal nicht erreichbar ist.
  let discordWarnError = null;
  const creatorDiscordId = String(creator?.discord_id || "").trim();

  if(/^\d{15,25}$/.test(creatorDiscordId)){
    const expiresAt = new Date(Date.now() + durationDays * 86400000).toISOString();
    const {data:discordWarnData,error:discordWarnInvokeError} = await sb.functions.invoke(
      "cv-discord-warns",
      {
        body:{
          discord_id:creatorDiscordId,
          creator_name:creator?.name || "Creator",
          reason,
          duration_days:durationDays,
          expires_at:expiresAt
        }
      }
    );

    if(discordWarnInvokeError || !discordWarnData?.success){
      discordWarnError = discordWarnInvokeError?.message || discordWarnData?.error || "Discord-Nachricht fehlgeschlagen.";
      console.error("cv-discord-warns:", discordWarnInvokeError || discordWarnData);
    }
  }else{
    discordWarnError = "Beim Creator ist keine gültige Discord-ID hinterlegt.";
    console.warn("Creator Warn wurde gespeichert, aber Discord-Post übersprungen:", discordWarnError);
  }

  closeModal();
  await reload();
  render("warns");

  if(discordWarnError){
    alert("Creator Warn wurde gespeichert, aber nicht im Discord gepostet: " + discordWarnError);
  }
}
