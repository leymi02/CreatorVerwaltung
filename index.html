<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreatorVerwaltung</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0a10;--panel:#15131d;--panel2:#1b1825;--text:#f7f3ff;--muted:#aaa3ba;--accent:#c6a6ff;--accent2:#f0b6e8;--line:#2a2637;--good:#92e6b1;--bad:#ff9cab}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 85% 0,#21172d 0,transparent 30%),var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(470px,100%);padding:38px;border:1px solid var(--line);border-radius:28px;background:rgba(21,19,29,.94);box-shadow:0 30px 80px #0008}.mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#15101b;font-weight:900;font-size:24px}.login h1{font-size:34px;margin:22px 0 8px}.muted{color:var(--muted)}.btn{border:0;border-radius:13px;padding:12px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#17111d;font-weight:800;cursor:pointer}.btn.secondary{background:#24202f;color:var(--text);border:1px solid var(--line)}.btn.danger{background:#3a2028;color:#ffdce2}.login .btn{width:100%;margin-top:24px;padding:15px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px;background:#0e0d13;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:20px;padding:8px 10px 24px}.nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--muted);padding:11px 12px;border-radius:11px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#1d1928;color:#fff}.side-bottom{position:absolute;bottom:20px;left:16px;right:16px}.main{padding:32px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:28px}.top h1{margin:0;font-size:29px}.pill{border:1px solid var(--line);background:#181520;padding:8px 11px;border-radius:999px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(180deg,#17141f,#121019);border:1px solid var(--line);border-radius:19px;padding:20px}.metric b{font-size:29px;display:block;margin-top:8px}.section{margin-top:20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:12px}.section h2{font-size:18px;margin:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:17px}table{width:100%;border-collapse:collapse;background:#121019}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}tr:last-child td{border-bottom:0}.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff536d;margin-right:7px}.empty{text-align:center;padding:42px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,select,textarea{background:#0f0d14;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px}textarea{min-height:95px;resize:vertical}
.modal-bg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#17141f;border:1px solid var(--line);border-radius:22px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px}.notice{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#15121d;color:var(--muted);margin:10px 0}
@media(max-width:950px){.shell{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.side-bottom{position:static;margin-top:15px}.grid{grid-template-columns:1fr 1fr}.main{padding:22px}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}}@media(max-width:560px){.grid,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="login-card"><div class="mark">CV</div><h1>CreatorVerwaltung</h1>
 <p class="muted">Interner Bereich für Creator, Streams, Warns, Termine und Organisation. Zugriff nur für von der Inhaberin freigegebene Discord-Accounts.</p>
 <div id="loginMsg" class="notice hidden"></div><button id="discordLogin" class="btn">Mit Discord anmelden</button></div>
</div>

<div id="app" class="shell hidden">
 <aside class="side"><div class="brand">CreatorVerwaltung</div><div class="nav" id="nav">
  <button data-page="dashboard" class="active">Dashboard</button><button data-page="creators">Creator</button><button data-page="live">Live jetzt</button>
  <button data-page="warns">Creator Warns</button><button data-page="calendar">Termine</button><button data-page="tasks">Meine Aufgaben</button>
  <button data-page="settings">Baukasten</button><button data-page="access" class="owner-only">Zugriffsverwaltung</button>
 </div><div class="side-bottom"><div id="who" class="pill"></div><button id="logout" class="btn secondary" style="width:100%;margin-top:10px">Abmelden</button></div></aside>
 <main class="main"><div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="muted" id="subtitle">Deine Creator-Verwaltung auf einen Blick.</div></div><div class="pill" id="rolePill"></div></div><div id="content"></div></main>
</div>
<div id="modalRoot"></div>

<script>
const SUPABASE_URL="https://sivdyarxpeuvvpdmzycw.supabase.co";
const SUPABASE_KEY="sb_publishable_dS1-tlpJEbpX8jW0vFHGkQ_Dfu_plgQ";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null, profile=null, access=null, creators=[], warns=[], events=[], tasks=[], categories=[], accesses=[], permissions=[];

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function discordIdFromUser(u){const md=u?.user_metadata||{};return String(md.provider_id||md.sub||u?.identities?.find(x=>x.provider==="discord")?.identity_data?.sub||u?.identities?.find(x=>x.provider==="discord")?.id||"")}
async function login(){await sb.auth.signInWithOAuth({provider:"discord",options:{redirectTo:location.origin+location.pathname}})}
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return;

  me = session.user;

  const {data, error} = await sb.rpc("cv_finish_discord_login");

  if(error){
    console.error("cv_finish_discord_login:", error);
    return deny("Discord-Anmeldung konnte nicht geprüft werden.");
  }

  const a = Array.isArray(data) ? data[0] : data;

  if(!a || !a.enabled){
    await sb.auth.signOut();
    return deny("Dieser Discord-Account wurde nicht für die CreatorVerwaltung freigegeben.");
  }

  access = a;

  const {data:p} = await sb
    .from("cv_profiles")
    .select("*")
    .eq("id", me.id)
    .maybeSingle();

  profile = p;

  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");

  $("#who").textContent =
    profile?.display_name ||
    access.display_name ||
    access.discord_username ||
    "Discord";

  $("#rolePill").textContent =
    access.role === "owner" ? "Inhaberin" : access.role;

  document.querySelectorAll(".owner-only").forEach(x =>
    x.classList.toggle("hidden", access.role !== "owner")
  );

  await reload();
  render("dashboard");
}
function deny(msg){$("#loginMsg").textContent=msg;$("#loginMsg").classList.remove("hidden")}
async function reload(){
  const [c,w,e,t,cat,a,p] = await Promise.all([
    sb.from("cv_creators").select("*").order("name"),
    sb.from("cv_warns").select("*").order("created_at",{ascending:false}),
    sb.from("cv_events").select("*").order("event_date"),
    sb.from("cv_tasks").select("*").order("done").order("due_date"),
    sb.from("cv_categories").select("*").order("position"),
    sb.from("cv_access").select("*").order("created_at"),
    sb.from("cv_permissions").select("*")
  ]);

  creators = c.data || [];
  warns = w.data || [];
  events = e.data || [];
  tasks = t.data || [];
  categories = cat.data || [];
  accesses = a.data || [];
  permissions = p.data || [];
  applyPermissionUI();
}
function myPermissions(){
  if(access?.role === "owner") return {};
  return permissions.find(p => String(p.discord_id) === String(access?.discord_id)) || {};
}

function hasPerm(name){
  if(access?.role === "owner") return true;
  return myPermissions()?.[name] === true;
}

function applyPermissionUI(){
  const rules = {
    creators:"creator_view",
    live:"live_view",
    warns:"warns_view",
    calendar:"events_view",
    tasks:"tasks_view",
    settings:"builder_view"
  };

  document.querySelectorAll("#nav button[data-page]").forEach(btn=>{
    const page=btn.dataset.page;
    if(page==="dashboard"){
      btn.classList.remove("hidden");
    }else if(page==="access"){
      btn.classList.toggle("hidden",access?.role!=="owner");
    }else{
      const perm=rules[page];
      btn.classList.toggle("hidden",perm ? !hasPerm(perm) : false);
    }
  });
}

function permissionDenied(){
  return `<div class="card empty">Für diesen Bereich hast du keine Berechtigung.</div>`;
}

function setPageTitle(p){const m={dashboard:["Dashboard","Deine Creator-Verwaltung auf einen Blick."],creators:["Creator","Profile, Links, Statistiken und interne Informationen."],live:["Live jetzt","Aktuelle Streams und gespeicherte Peak-Zuschauer."],warns:["Creator Warns","Warnungen und Laufzeiten übersichtlich verwalten."],calendar:["Termine","Persönliche und gemeinsame Termine."],tasks:["Meine Aufgaben","Deine privaten To-dos."],settings:["Baukasten","Kategorien der Verwaltung selbst organisieren."],access:["Zugriffsverwaltung","Du entscheidest, welche Discord-Accounts Zugriff haben."]};$("#pageTitle").textContent=m[p][0];$("#subtitle").textContent=m[p][1]}
function render(p){
  const perms={creators:"creator_view",live:"live_view",warns:"warns_view",calendar:"events_view",tasks:"tasks_view",settings:"builder_view"};
  if(p==="access" && access.role!=="owner") p="dashboard";
  if(perms[p] && !hasPerm(perms[p])) p="dashboard";
  setPageTitle(p);
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
  const fn={dashboard:dash,creators:creatorPage,live:livePage,warns:warnPage,calendar:eventPage,tasks:taskPage,settings:settingsPage,access:accessPage}[p];
  $("#content").innerHTML=fn();
}
function dash(){let live=creators.filter(c=>c.is_live).length;return `<div class="grid">
${metric("Probe Streamer",creators.filter(c=>c.rank==="Probe Streamer").length)}${metric("Streamer",creators.filter(c=>c.rank==="Streamer").length)}${metric("Creator",creators.filter(c=>c.rank==="Creator").length)}${metric("Aktive Warns",warns.filter(w=>new Date(w.expires_at)>new Date()).length)}
</div><div class="section"><div class="section-head"><h2>30-Tage-Aktivität</h2><span class="pill">${live} live</span></div>${creatorTable(creators.slice(0,8))}</div>`}
function metric(a,b){return `<div class="card metric"><span class="muted">${a}</span><b>${b}</b></div>`}
function creatorTable(arr){
  if(!arr.length) return `<div class="card empty">Noch keine Creator angelegt.</div>`;

  return `<div class="table-wrap"><table>
    <thead><tr>
      <th>Name</th><th>Rang</th><th>Twitch</th><th>Tage</th><th>Ø Zuschauer</th><th>Peak</th>
      ${hasPerm("creator_edit") ? "<th>Aktionen</th>" : ""}
    </tr></thead>
    <tbody>${arr.map(c=>`<tr>
      <td><b>${esc(c.name)}</b></td>
      <td>${esc(c.rank)}</td>
      <td>${c.twitch_url?`<a href="${esc(c.twitch_url)}" target="_blank">Twitch öffnen</a>`:"–"}</td>
      <td>${c.twitch_days_30d ?? 0}</td>
      <td>${c.twitch_avg_viewers_30d ?? 0}</td>
      <td>${c.twitch_peak_viewers_30d ?? 0}</td>
      ${hasPerm("creator_edit")?`<td><button class="btn secondary" onclick="editCreator('${c.id}')">✎ Bearbeiten</button></td>`:""}
    </tr>`).join("")}</tbody>
  </table></div>`;
}
function creatorPage(){
  if(!hasPerm("creator_view")) return permissionDenied();
  return `<div class="section-head"><h2>Alle Creator</h2>${hasPerm("creator_create")?`<button class="btn" onclick="creatorModal()">+ Creator anlegen</button>`:""}</div>${creatorTable(creators)}<div class="notice">Creator können mit Discord-ID, Twitch-/TikTok-Link, Rang, Eintrittsdatum und internen Informationen angelegt werden.</div>`;
}
function livePage(){return `<div class="grid">${metric("Gerade live",0)}${metric("Höchster 30T-Peak",Math.max(0,...creators.map(c=>c.twitch_peak_viewers_30d||0)))}${metric("Erfasste Creator",creators.length)}${metric("Plattform","Twitch")}</div><div class="section card empty">Die Live-Abfrage wird im nächsten Integrationsschritt mit der Twitch API verbunden. Die Datenbank für Live-Sessions und Peaks ist bereits vorbereitet.</div>`}
function warnPage(){
  if(!hasPerm("warns_view")) return permissionDenied();
  return `<div class="section-head"><h2>Warnungen</h2>${hasPerm("warns_create")?`<button class="btn" onclick="warnModal()">+ Warn hinzufügen</button>`:""}</div>${warns.length?`<div class="table-wrap"><table><thead><tr><th>Creator</th><th>Grund</th><th>Dauer</th><th>Endet</th></tr></thead><tbody>${warns.map(w=>`<tr><td>${esc(creators.find(c=>c.id===w.creator_id)?.name||"—")}</td><td>${esc(w.reason)}</td><td>${w.duration_days} Tage</td><td>${new Date(w.expires_at).toLocaleDateString("de-DE")}</td></tr>`).join("")}</tbody></table></div>`:`<div class="card empty">Keine Warnungen vorhanden.</div>`}`;
}
function eventPage(){
  if(!hasPerm("events_view")) return permissionDenied();
  return `<div class="section-head"><h2>Termine</h2>${hasPerm("events_create")?`<button class="btn" onclick="eventModal()">+ Termin</button>`:""}</div>${events.length?`<div class="table-wrap"><table><thead><tr><th>Datum</th><th>Termin</th><th>Sichtbarkeit</th></tr></thead><tbody>${events.map(e=>`<tr><td>${esc(e.event_date)} ${esc(e.event_time||"")}</td><td>${esc(e.title)}</td><td>${e.visibility==="team"?"Team":"Nur ich"}</td></tr>`).join("")}</tbody></table></div>`:`<div class="card empty">Noch keine Termine.</div>`}`;
}
function taskPage(){
  if(!hasPerm("tasks_view")) return permissionDenied();
  return `<div class="section-head"><h2>Meine Aufgaben</h2>${hasPerm("tasks_create")?`<button class="btn" onclick="taskModal()">+ Aufgabe</button>`:""}</div>${tasks.length?tasks.map(t=>`<div class="card" style="margin-bottom:10px"><b>${esc(t.title)}</b><div class="muted small">${esc(t.priority)} · ${esc(t.due_date||"ohne Termin")}</div></div>`).join(""):`<div class="card empty">Du hast noch keine Aufgaben.</div>`}`;
}
function settingsPage(){
  if(!hasPerm("builder_view")) return permissionDenied();
  return `<div class="section-head"><h2>Kategorien</h2>${hasPerm("builder_edit")?`<button class="btn" onclick="categoryModal()">+ Kategorie</button>`:""}</div>${categories.map(c=>`<div class="card" style="margin-bottom:10px;display:flex;justify-content:space-between"><span>${esc(c.name)}</span><span class="muted">${c.visible?"Sichtbar":"Ausgeblendet"}</span></div>`).join("")}<div class="notice">Der Baukasten kann über Berechtigungen freigegeben werden.</div>`;
}
function accessPage(){
  if(access.role!=="owner") return "";

  const list = accesses.length
    ? accesses.map(a => {
        const roleName =
          a.role === "owner" ? "Inhaberin" :
          a.role === "admin" ? "Admin" :
          "Member";

        const status = a.enabled ? "Aktiv" : "Gesperrt";

        return `
          <div class="card" style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;gap:16px;align-items:center">
              <div>
                <b>${esc(a.display_name || a.discord_username || "Discord Benutzer")}</b>
                <div class="muted small">${esc(a.discord_id)}</div>
                <div class="muted small" style="margin-top:4px">${status}</div>
              </div>

              <div style="display:flex;gap:8px;align-items:center">
                <div class="pill">${roleName}</div>
                ${a.role!=="owner"?`<button class="btn secondary" onclick="permissionModal('${a.discord_id}')">⚙ Berechtigungen</button>`:""}
              </div>
            </div>
          </div>
        `;
      }).join("")
    : `<div class="card empty">Noch keine Discord-Accounts freigegeben.</div>`;

  return `
    <div class="section-head">
      <h2>Discord-Freigaben</h2>
      <button class="btn" onclick="accessModal()">+ Discord-Account</button>
    </div>

    <div class="notice">
      Hier kannst du neue Discord-IDs freigeben. Gesperrte Accounts verlieren den Zugriff auf die Verwaltungsdaten.
    </div>

    <div style="margin-top:14px">
      ${list}
    </div>
  `;
}
const permissionGroups=[
  ["Creator",[["creator_view","Ansehen"],["creator_create","Anlegen"],["creator_edit","Bearbeiten"],["creator_delete","Löschen"]]],
  ["Creator Warns",[["warns_view","Ansehen"],["warns_create","Warn hinzufügen"],["warns_delete","Warn löschen"]]],
  ["Live",[["live_view","Ansehen"]]],
  ["Termine",[["events_view","Ansehen"],["events_create","Anlegen"],["events_edit","Bearbeiten"],["events_delete","Löschen"]]],
  ["Aufgaben",[["tasks_view","Ansehen"],["tasks_create","Anlegen"],["tasks_edit","Bearbeiten"],["tasks_delete","Löschen"]]],
  ["Baukasten",[["builder_view","Ansehen"],["builder_edit","Bearbeiten"]]]
];

function permissionModal(discordId){
  const a=accesses.find(x=>String(x.discord_id)===String(discordId));
  const current=permissions.find(x=>String(x.discord_id)===String(discordId))||{};

  const groups=permissionGroups.map(([title,items])=>`
    <div class="card" style="margin-bottom:10px">
      <b>${title}</b>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px">
        ${items.map(([key,label])=>`<label style="display:flex;gap:9px;align-items:center;cursor:pointer">
          <input type="checkbox" id="perm_${key}" ${current[key]===true?"checked":""}>
          <span>${label}</span>
        </label>`).join("")}
      </div>
    </div>`).join("");

  modal(`Berechtigungen – ${esc(a?.display_name||a?.discord_username||discordId)}`,
    `<div class="notice">Du entscheidest, welche Bereiche dieser Discord-Account sehen oder verändern darf.</div>
     <div class="actions" style="margin:12px 0">
       <button class="btn secondary" type="button" onclick="setAllPermissions(true)">Alle erlauben</button>
       <button class="btn secondary" type="button" onclick="setAllPermissions(false)">Alle entfernen</button>
     </div>${groups}`,
    `savePermissions('${discordId}')`);
}

function setAllPermissions(value){
  permissionGroups.flatMap(g=>g[1]).forEach(([key])=>{
    const el=$("#perm_"+key);
    if(el) el.checked=value;
  });
}

async function savePermissions(discordId){
  const row={discord_id:String(discordId),updated_at:new Date().toISOString()};
  permissionGroups.flatMap(g=>g[1]).forEach(([key])=>row[key]=!!$("#perm_"+key)?.checked);

  const {error}=await sb.from("cv_permissions").upsert(row,{onConflict:"discord_id"});
  if(error){
    console.error(error);
    alert("Berechtigungen konnten nicht gespeichert werden: "+error.message);
    return;
  }
  closeModal();
  await reload();
  render("access");
}

function modal(title,body,save){$("#modalRoot").innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-head"><b>${title}</b><button class="btn secondary" onclick="closeModal()">✕</button></div>${body}<div class="actions" style="margin-top:18px"><button class="btn" onclick="${save}">Speichern</button><button class="btn secondary" onclick="closeModal()">Abbrechen</button></div></div></div>`}
function closeModal(){$("#modalRoot").innerHTML=""}
function creatorModal(){if(!hasPerm("creator_create"))return alert("Keine Berechtigung.");modal("Creator anlegen",`<div class="form-grid">${f("cname","Name")}${sel("crank","Rang",["Probe Streamer","Streamer","Creator"])}${f("cdiscord","Discord-ID")}${f("ctwitch","Twitch-Link")}${f("ctiktok","TikTok-Link")}${f("cjoined","Dabei seit","date")}<div class="field full"><label>Interne Info</label><textarea id="csummary"></textarea></div></div>`,"saveCreator()")}
 async function saveCreator(){
  const name = $("#cname").value.trim();
  const rank = $("#crank").value;
  const discordId = $("#cdiscord").value.trim();
  const twitchUrl = $("#ctwitch").value.trim();
  const tiktokUrl = $("#ctiktok").value.trim();
  const joinedAt = $("#cjoined").value || null;
  const summary = $("#csummary").value.trim();

  if(!name){
    alert("Bitte einen Namen eintragen.");
    return;
  }

  const {error} = await sb.rpc("cv_add_creator", {
    p_name: name,
    p_rank: rank,
    p_discord_id: discordId,
    p_twitch_url: twitchUrl,
    p_tiktok_url: tiktokUrl,
    p_joined_at: joinedAt,
    p_summary: summary
  });

  if(error){
    console.error(error);
    alert("Creator konnte nicht gespeichert werden: " + error.message);
    return;
  }

  closeModal();
  await reload();
  render("creators");
}

function editCreator(id){
  if(!hasPerm("creator_edit")){alert("Keine Berechtigung.");return;}
  const c = creators.find(x => x.id === id);
  if(!c){ alert("Creator wurde nicht gefunden."); return; }

  modal("Creator bearbeiten", `<div class="form-grid">
    ${f("ename","Name")}
    ${sel("erank","Rang",["Probe Streamer","Streamer","Creator"])}
    ${f("ediscord","Discord-ID")}
    ${f("etwitch","Twitch-Link")}
    ${f("etiktok","TikTok-Link")}
    ${f("ejoined","Dabei seit","date")}
    <div class="field full"><label>Interne Info</label><textarea id="esummary"></textarea></div>
  </div>`, `updateCreator('${id}')`);

  $("#ename").value = c.name || "";
  $("#erank").value = c.rank || "Probe Streamer";
  $("#ediscord").value = c.discord_id || "";
  $("#etwitch").value = c.twitch_url || "";
  $("#etiktok").value = c.tiktok_url || "";
  $("#ejoined").value = c.joined_at ? String(c.joined_at).slice(0,10) : "";
  $("#esummary").value = c.summary || "";
}

async function updateCreator(id){
  const name = $("#ename").value.trim();
  const rank = $("#erank").value;
  const discordId = $("#ediscord").value.trim();
  const twitchUrl = $("#etwitch").value.trim();
  const tiktokUrl = $("#etiktok").value.trim();
  const joinedAt = $("#ejoined").value || null;
  const summary = $("#esummary").value.trim();

  if(!name){
    alert("Bitte einen Namen eintragen.");
    return;
  }

  const {error} = await sb.rpc("cv_update_creator", {
    p_id: id,
    p_name: name,
    p_rank: rank,
    p_discord_id: discordId,
    p_twitch_url: twitchUrl,
    p_tiktok_url: tiktokUrl,
    p_joined_at: joinedAt,
    p_summary: summary
  });

  if(error){
    console.error(error);
    alert("Änderungen konnten nicht gespeichert werden: " + error.message);
    return;
  }

  closeModal();
  await reload();
  render("creators");
}

function warnModal(){
  if(!hasPerm("warns_create")){alert("Keine Berechtigung.");return;}
  if(!creators.length){
    alert("Bitte zuerst einen Creator anlegen.");
    return;
  }

  modal(
    "Creator Warn",
    `<div class="form-grid">
      ${selObj("wcreator","Creator",creators)}
      ${f("wreason","Grund")}
      ${f("wdays","Dauer in Tagen","number")}
      <div class="field full">
        <div class="notice" style="margin:0">
          Das Ablaufdatum wird automatisch aus der eingegebenen Dauer berechnet.
        </div>
      </div>
    </div>`,
    "saveWarn()"
  );

  $("#wdays").min = "1";
  $("#wdays").value = "14";
}
async function saveWarn(){
  const creatorId = $("#wcreator").value;
  const reason = $("#wreason").value.trim();
  const durationDays = Math.max(1, Number($("#wdays").value || 1));

  if(!creatorId){
    alert("Bitte einen Creator auswählen.");
    return;
  }

  if(!reason){
    alert("Bitte einen Grund eintragen.");
    return;
  }

  const {error} = await sb.rpc("cv_add_warn", {
    p_creator_id: creatorId,
    p_reason: reason,
    p_duration_days: durationDays
  });

  if(error){
    console.error(error);
    alert("Warn konnte nicht gespeichert werden: " + error.message);
    return;
  }

  closeModal();
  await reload();
  render("warns");
}
function eventModal(){if(!hasPerm("events_create"))return alert("Keine Berechtigung.");modal("Termin anlegen",`<div class="form-grid">${f("etitle","Titel")}${f("edate","Datum","date")}${f("etime","Uhrzeit","time")}${sel("evis","Sichtbarkeit",["personal","team"])}<div class="field full"><label>Beschreibung</label><textarea id="edesc"></textarea></div></div>`,"saveEvent()")}
async function saveEvent(){await sb.from("cv_events").insert({owner_id:me.id,title:$("#etitle").value,event_date:$("#edate").value,event_time:$("#etime").value||null,description:$("#edesc").value||null,visibility:$("#evis").value});closeModal();await reload();render("calendar")}
function taskModal(){if(!hasPerm("tasks_create"))return alert("Keine Berechtigung.");modal("Aufgabe anlegen",`<div class="form-grid">${f("ttitle","Aufgabe")}${f("tdue","Fällig am","date")}${sel("tprio","Priorität",["Niedrig","Normal","Hoch"])}<div class="field full"><label>Notiz</label><textarea id="tnote"></textarea></div></div>`,"saveTask()")}
async function saveTask(){await sb.from("cv_tasks").insert({owner_id:me.id,title:$("#ttitle").value,due_date:$("#tdue").value||null,priority:$("#tprio").value,note:$("#tnote").value||null});closeModal();await reload();render("tasks")}
function categoryModal(){if(!hasPerm("builder_edit"))return alert("Keine Berechtigung.");modal("Kategorie hinzufügen",`<div class="form-grid">${f("catname","Name")}${f("catslug","Kurzname / Slug")}${f("catpos","Position","number")}</div>`,"saveCategory()")}
async function saveCategory(){await sb.from("cv_categories").insert({name:$("#catname").value,slug:$("#catslug").value.toLowerCase().replace(/[^a-z0-9-]/g,"-"),position:Number($("#catpos").value||100)});closeModal();await reload();render("settings")}
function accessModal(){modal("Discord-Account freigeben",`<div class="form-grid">${f("adid","Discord-ID")}${f("adname","Anzeigename")}${sel("adrole","Rolle",["member","admin"])}</div>`,"saveAccess()")}
async function saveAccess(){
  const discordId = $("#adid").value.trim();
  const displayName = $("#adname").value.trim();
  const role = $("#adrole").value;

  if(!discordId){
    alert("Bitte eine Discord-ID eintragen.");
    return;
  }

  const {error} = await sb.rpc("cv_add_access", {
    p_discord_id: discordId,
    p_display_name: displayName,
    p_role: role
  });

  if(error){
    console.error(error);
    alert("Speichern fehlgeschlagen: " + error.message);
    return;
  }

  closeModal();
  await reload();
  render("access");
}
function f(id,label,type="text"){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}"></div>`}
function sel(id,label,opts){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(x=>`<option value="${x}">${x}</option>`).join("")}</select></div>`}
function selObj(id,label,arr){return `<div class="field"><label>${label}</label><select id="${id}">${arr.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div>`}
$("#discordLogin").onclick=login;$("#logout").onclick=async()=>{await sb.auth.signOut();location.reload()};$("#nav").onclick=e=>{let b=e.target.closest("button[data-page]");if(b)render(b.dataset.page)};
sb.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();
